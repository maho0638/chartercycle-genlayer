name: CharterCycle read-only failed outer transaction analysis
on:
  push:
    paths:
      - "proofs/inspect_outer_transactions.py"
      - ".github/workflows/chartercycle-outer-inspection.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Inspect outer Studio receipt, GenLayer state, and pure simulation
        run: gltest proofs/inspect_outer_transactions.py -v -s --network studionet
