name: CharterCycle live time-lock enactment (Studio-aware SDK)
on:
  push:
    paths:
      - "proofs/chartercycle_resumption_trigger.txt"
      - "proofs/chartercycle_enact_studio_js.mjs"
      - ".github/workflows/chartercycle-timelock-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chartercycle-single-proposal-enactment
  cancel-in-progress: false

jobs:
  resume-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install source-pinned, official Studio-aware GenLayer JS SDK
        run: npm install --no-save "github:genlayerlabs/genlayer-js#1b7f50a3a3f2963ea857941b0fb386081dd5c326"
      - name: Verify original Python contract checksum (not a deployment)
        run: |
          sha256sum contracts/charter_cycle.py
          echo "Existing contract only; no redeploy"
      - name: Check governance guards; enact once if eligible; verify finalized status
        run: node proofs/chartercycle_enact_studio_js.mjs
