name: CharterCycle read-only EVM finalize diagnostics
on:
  push:
    paths:
      - "proofs/diagnose_finalize.py"
      - ".github/workflows/chartercycle-finalize-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Inspect balance, gas estimate, eth_call, and contract state without sending
        run: gltest proofs/diagnose_finalize.py -v -s --network studionet
